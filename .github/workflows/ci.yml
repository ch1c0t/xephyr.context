name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  library:
    uses: ./.github/workflows/library-specs.yml

  integration:
    needs: build
    uses: ./.github/workflows/integration-specs.yml

  ruby-cli:
    needs: build
    uses: ./.github/workflows/ruby-cli-specs.yml

  review-evidence:
    if: always()
    needs: [build, library, integration, ruby-cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REVIEW_EVIDENCE_DIR: review-evidence
      REVIEW_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      REVIEW_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
      REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Set up Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.22.0

      - name: Download worker evidence
        if: always()
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: review-evidence-*
          path: review-evidence-inputs

      - name: Initialize review evidence
        if: always()
        run: ruby script/review_evidence.rb init

      - name: Merge worker evidence
        if: always()
        run: script/ci/merge-review-evidence.sh

      - name: Finalize review evidence
        if: always()
        run: ruby script/review_evidence.rb finalize

      - name: Upload review evidence
        id: upload-evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: review-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish review evidence comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        continue-on-error: true
        env:
          REVIEW_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ARTIFACT_URL: ${{ steps.upload-evidence.outputs.artifact-url }}
          UPLOAD_OUTCOME: ${{ steps.upload-evidence.outcome || 'skipped' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const publish = require(process.env.GITHUB_WORKSPACE + '/script/ci/publish-review-evidence-comment.js')
            await publish({ github, context, core })
