name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            gnupg \
            libtesseract-dev \
            libx11-dev

      - name: Install LavinMQ package repository
        run: |
          curl -fsSL https://packagecloud.io/install/repositories/cloudamqp/lavinmq/script.deb.sh | sudo bash
          sudo apt-get update
          sudo apt-get install -y lavinmq
          sudo systemctl stop lavinmq.service || true

      - name: Start isolated LavinMQ instance
        shell: bash
        run: |
          set -euo pipefail

          directory="$RUNNER_TEMP/lavinmq"
          socket="$directory/amqp.sock"
          mkdir -p "$directory/data"

          cat > "$directory/lavinmq.ini" <<EOF
          [main]
          data_dir = $directory/data
          control_unix_path = $directory/control.sock

          [amqp]
          port = -1
          unix_path = $socket

          [mgmt]
          port = -1
          EOF

          lavinmq --config="$directory/lavinmq.ini" \
            >"$directory/lavinmq.log" 2>&1 &
          pid=$!
          echo "$pid" > "$directory/lavinmq.pid"

          for attempt in $(seq 1 30); do
            if [[ -S "$socket" ]]; then
              echo "LAVINMQ_AMQP_UNIXSOCKET=$socket" >> "$GITHUB_ENV"
              exit 0
            fi

            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$directory/lavinmq.log"
              echo "LavinMQ exited before creating its AMQP socket" >&2
              exit 1
            fi

            sleep 1
          done

          cat "$directory/lavinmq.log"
          echo "Timed out waiting for the LavinMQ UNIX socket" >&2
          exit 1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Set up Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.22.0

      - name: Install Crystal dependencies
        run: shards install

      - name: Generate and build executables
        run: bundle exec rake

      - name: Run Crystal specs
        run: crystal spec

      - name: Run Ruby CLI specs
        run: bundle exec rspec

      - name: Show LavinMQ log on failure
        if: failure()
        run: |
          if [[ -f "$RUNNER_TEMP/lavinmq/lavinmq.log" ]]; then
            tail -n 200 "$RUNNER_TEMP/lavinmq/lavinmq.log"
          fi

      - name: Stop LavinMQ
        if: always()
        run: |
          pid_file="$RUNNER_TEMP/lavinmq/lavinmq.pid"
          if [[ -f "$pid_file" ]]; then
            kill "$(cat "$pid_file")" 2>/dev/null || true
          fi
