name: Xvfb integration specs

on:
  workflow_call:

jobs:
  integration-specs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      REVIEW_EVIDENCE_DIR: review-evidence
      REVIEW_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      REVIEW_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
      REVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Initialize review evidence
        run: ruby script/review_evidence.rb init

      - name: Install native and X11 dependencies
        run: script/ci/install-integration-dependencies.sh

      - name: Install LavinMQ package repository
        run: script/ci/install-lavinmq.sh

      - name: Start isolated LavinMQ instance
        run: script/ci/start-lavinmq.sh

      - name: Set up Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.22.0

      - name: Install Crystal dependencies
        run: shards install

      - name: Download built executables
        uses: actions/download-artifact@v4
        with:
          name: xephyr-context-binaries-${{ github.run_attempt }}
          path: bin

      - name: Restore executable permissions
        run: chmod +x bin/*

      - name: Start Xvfb
        run: script/ci/start-xvfb.sh

      - name: Run Xvfb executable integration specs
        run: ruby script/review_evidence.rb run crystal-integration-specs crystal spec spec/integration
        continue-on-error: true

      - name: Capture runtime process table
        if: always()
        run: script/ci/capture-process-table.sh

      - name: Stop Xvfb
        if: always()
        run: script/ci/stop-xvfb.sh

      - name: Stop LavinMQ
        if: always()
        run: script/ci/stop-lavinmq.sh

      - name: Collect service logs
        if: always()
        run: script/ci/collect-service-logs.sh

      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-evidence-integration-${{ github.run_attempt }}
          path: review-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify recorded checks
        if: always()
        run: ruby script/review_evidence.rb verify
