name: Ruby CLI specs

on:
  workflow_call:

jobs:
  ruby-cli-specs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REVIEW_EVIDENCE_DIR: review-evidence
      REVIEW_PR_NUMBER: \${{ github.event.pull_request.number || '' }}
      REVIEW_PR_HEAD_SHA: \${{ github.event.pull_request.head.sha || '' }}
      REVIEW_BASE_SHA: \${{ github.event.pull_request.base.sha || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Initialize review evidence
        run: ruby script/review_evidence.rb init

      - name: Run Ruby CLI specs
        run: ruby script/review_evidence.rb run ruby-cli-specs bundle exec rspec
        continue-on-error: true

      - name: Upload Ruby CLI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-evidence-ruby-cli-\${{ github.run_attempt }}
          path: review-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Verify recorded checks
        if: always()
        run: ruby script/review_evidence.rb verify
